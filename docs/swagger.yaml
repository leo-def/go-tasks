host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: |-
    GoTasks is a robust API for managing company tasks and collaborations.
    It provides comprehensive features for:
    - **Company and Collaborator Management**: Onboard companies and manage staff with hierarchical roles.
    - **Activity and Task Lifecycle Tracking**: Create and monitor activities and tasks through various stages.
    - **Role-Based Access Control (RBAC)**: Secure endpoints with granular permissions for Admins, Ops, Owners, and Managers.
    - **Performance Ratings and Assignments**: Assign tasks to collaborators and rate their performance.
    - **Secure Authentication**: JWT-based authentication for secure access.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GoTasks API
  version: "1.0"
paths:
  /admin-or-ops/company/:
    get:
      consumes:
      - application/json
      description: Get a list of all companies with pagination
      parameters:
      - default: 0
        description: Number of items to skip
        in: query
        name: skip
        type: integer
      - default: 20
        description: Maximum number of items to return
        in: query
        name: limit
        type: integer
      - default: id
        description: Field to sort by
        enum:
        - id
        - title
        in: query
        name: sortBy
        type: string
      - default: ASC
        description: Sort order
        enum:
        - ASC
        - DESC
        in: query
        name: sortOrder
        type: string
      - description: Filter expression
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.Response-go-tasks_internal_pkg_httpx_Paginated-internal_company_CompanyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get all companies
      tags:
      - Company | Admin or Ops
    post:
      consumes:
      - application/json
      description: Atomically creates a company, its owner account (hashed password
        via account service), and links the owner as a collaborator.
      parameters:
      - description: Company data
        in: body
        name: company
        required: true
        schema:
          $ref: '#/definitions/internal_company.CompanyCreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.Response-internal_company_CompanyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Create a new company
      tags:
      - Company | Admin or Ops
  /admin-or-ops/company/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a company by its unique ID
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.Response-go-tasks_internal_pkg_httpx_MessageDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Delete a company
      tags:
      - Company | Admin or Ops
    get:
      consumes:
      - application/json
      description: Get a company by its unique ID
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.Response-internal_company_CompanyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get company by ID
      tags:
      - Company | Admin or Ops
    put:
      consumes:
      - application/json
      description: Update the details of an existing company
      parameters:
      - description: Company ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Company data
        in: body
        name: company
        required: true
        schema:
          $ref: '#/definitions/internal_company.CompanyUpdateDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.Response-internal_company_CompanyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update a company
      tags:
      - Company | Admin or Ops
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: Sign in a user and return a JWT token
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_auth.SignInDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.Response-internal_auth_AuthTokenResposne'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
      summary: Sign in a user
      tags:
      - Auth | Public
  /auth/sign-up:
    post:
      consumes:
      - application/json
      description: Creates a new account with a securely hashed password via account
        service. Returns 204 with no body.
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_auth.SignUpDTO'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go-tasks_internal_pkg_httpx.ErrorResponse'
      summary: Sign up a new user
      tags:
      - Auth | Public
  /company/activity/own/:
    get:
      consumes:
      - application/json
      description: List your activities with pagination
      parameters:
      - default: 0
