root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -gcflags 'all=-N -l' -o ./tmp/go-tasks-debug ./cmd/api"
bin = "./tmp/go-tasks-debug"
full_bin = "dlv exec ./tmp/go-tasks-debug --listen=:2345 --headless --api-version=2 --accept-multiclient"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "docs", "migrations", "db"]
delay = 1000
stop_on_error = true

[log]
time = true

[env]
APP_PORT = "8080"
DATABASE_DRIVER = "sqlite3"
DATABASE_URL = "./db/go-tasks.db"
LOG_LEVEL = "debug"
HTTP_LOG = "true"
